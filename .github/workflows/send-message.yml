name: Send message to Discord

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Select target channel"
        type: choice
        options:
          - general
          - chapters
          - novels
          - rules
          - server_roles
          - server_announcements
          - level
          - novel_lists
          - novel_roles
          - off_topic
          - novel_discussions
          - novel_recommendations
          - novel_request
          - spoilers
          - novel_illustration
          - nsfw
        default: general
      ping:
        description: "Who to ping"
        type: choice
        options: [none, chapter_role, novel_role]
        default: none
      style:
        description: "Look of the message"
        type: choice
        options: [embed, plain]
        default: embed
      title:
        description: "Title (optional)"
        type: string
        required: false
      message:
        description: "Your message. Type \\n where you want a new line"
        type: string
        required: true
      link_url:
        description: "Link (optional, makes title clickable)"
        type: string
        required: false
      image_url:
        description: "Image URL (optional)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send
        env:
          CHAPTER_WEBHOOK: ${{ secrets.CHAPTER_WEBHOOK }}
          NOVEL_WEBHOOK: ${{ secrets.NOVEL_WEBHOOK }}
          GENERAL_WEBHOOK: ${{ secrets.GENERAL_WEBHOOK }}
          RULES_WEBHOOK: ${{ secrets.RULES_WEBHOOK }}
          SERVER_ROLES_WEBHOOK: ${{ secrets.SERVER_ROLES_WEBHOOK }}
          SERVER_ANNOUNCEMENTS_WEBHOOK: ${{ secrets.SERVER_ANNOUNCEMENTS_WEBHOOK }}
          LEVEL_WEBHOOK: ${{ secrets.LEVEL_WEBHOOK }}
          NOVEL_LISTS_WEBHOOK: ${{ secrets.NOVEL_LISTS_WEBHOOK }}
          NOVEL_ROLES_WEBHOOK: ${{ secrets.NOVEL_ROLES_WEBHOOK }}
          OFF_TOPIC_WEBHOOK: ${{ secrets.OFF_TOPIC_WEBHOOK }}
          NOVEL_DISCUSSIONS_WEBHOOK: ${{ secrets.NOVEL_DISCUSSIONS_WEBHOOK }}
          NOVEL_RECOMMENDATIONS_WEBHOOK: ${{ secrets.NOVEL_RECOMMENDATIONS_WEBHOOK }}
          NOVEL_REQUEST_WEBHOOK: ${{ secrets.NOVEL_REQUEST_WEBHOOK }}
          SPOILERS_WEBHOOK: ${{ secrets.SPOILERS_WEBHOOK }}
          NOVEL_ILLUSTRATION_WEBHOOK: ${{ secrets.NOVEL_ILLUSTRATION_WEBHOOK }}
          NSFW_WEBHOOK: ${{ secrets.NSFW_WEBHOOK }}
          CHAPTER_ROLE_ID: ${{ secrets.CHAPTER_ROLE_ID }}
          NOVEL_ROLE_ID: ${{ secrets.NOVEL_ROLE_ID }}
          CHANNEL: ${{ inputs.channel }}
          PING: ${{ inputs.ping }}
          STYLE: ${{ inputs.style }}
          TITLE: ${{ inputs.title }}
          MESSAGE: ${{ inputs.message }}
          LINK_URL: ${{ inputs.link_url }}
          IMAGE_URL: ${{ inputs.image_url }}
        run: python send_message.py
