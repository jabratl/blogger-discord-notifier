name: Discord notifier

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print only, send nothing)"
        type: boolean
        default: false
      test_latest:
        description: "Send the latest chapter once as a test"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: discord-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run notifier
        env:
          CHAPTER_WEBHOOK: ${{ secrets.CHAPTER_WEBHOOK }}
          NOVEL_WEBHOOK: ${{ secrets.NOVEL_WEBHOOK }}
          CHAPTER_ROLE_ID: ${{ secrets.CHAPTER_ROLE_ID }}
          NOVEL_ROLE_ID: ${{ secrets.NOVEL_ROLE_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          TEST_LATEST: ${{ inputs.test_latest && '1' || '0' }}
        run: python notify.py

      - name: Save state
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name "jabratl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
